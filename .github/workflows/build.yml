name: Build Tim Kiem Van Ban (EXE + APK + HTML)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: TimKiemVanBan-HTML
          path: web/TimKiemVanBan.html

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Chép giao diện vào bản Windows
        shell: bash
        run: mkdir -p desktop/app && cp web/TimKiemVanBan.html desktop/app/index.html
      - name: Cài thư viện
        working-directory: desktop
        run: npm install
      - name: Build file exe
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: TimKiemVanBan-EXE
          path: desktop/dist/TimKiemVanBan.exe

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Dùng Android SDK có sẵn trên máy build, chấp nhận license
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
      - name: Chép giao diện vào bản Android
        run: mkdir -p mobile/www && cp web/TimKiemVanBan.html mobile/www/index.html
      - name: Cài Capacitor và tạo dự án Android
        working-directory: mobile
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Cấu hình quyền lưu trữ, bộ nhớ lớn cho OCR
        working-directory: mobile/android/app/src/main
        run: |
          sed -i 's#<application#<application android:largeHeap="true" android:requestLegacyExternalStorage="true"#' AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n</manifest>#' AndroidManifest.xml
          cat AndroidManifest.xml
      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../TimKiemVanBan.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TimKiemVanBan-APK
          path: TimKiemVanBan.apk
